<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Thanks - AI Skin Disease Detection</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
	<style>
		.thanks-wrap { min-height:70vh; display:flex; align-items:center; justify-content:center; padding:40px; background:#f9fbfd }
		.thanks-card { background:white; padding:40px; border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,0.08); text-align:center; max-width:640px }
		.thanks-anim { width:120px; height:120px; margin:0 auto 20px }
		.btn-home { padding:10px 22px; background:#0a3d62; color:white; border-radius:8px; text-decoration:none; font-weight:700 }
	</style>
</head>
<body>
<header class="navbar">
	<div class="logo">SkinCare AI</div>
	<nav>
		<a href="{{ url_for('home') }}">Home</a>
		<a href="{{ url_for('login') }}">Login</a>
		<a href="{{ url_for('faq') }}">FAQ</a>
		<a href="{{ url_for('help_page') }}">Help</a>
		<a href="{{ url_for('feedback') }}">Feedback</a>
	</nav>
</header>

<div class="thanks-wrap">
	<div class="thanks-card">
		<svg class="thanks-anim" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
			<circle cx="60" cy="60" r="52" stroke="#4caf50" stroke-width="6" fill="none" stroke-dasharray="326" stroke-dashoffset="326">
				<animate attributeName="stroke-dashoffset" from="326" to="0" dur="0.9s" fill="freeze" />
			</circle>
			<path d="M36 62 l12 12 36-40" fill="none" stroke="#4caf50" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="80" stroke-dashoffset="80">
				<animate attributeName="stroke-dashoffset" from="80" to="0" begin="0.9s" dur="0.45s" fill="freeze" />
			</path>
		</svg>
		<h2>Thanks for your feedback</h2>
		<p style="color:#666; max-width:560px; margin:12px auto">We appreciate your input — it helps improve the AI. If you'd like, you can go back to the homepage to continue using the tool.</p>
		<a class="btn-home" href="{{ url_for('home') }}">Return to Home</a>
	</div>
</div>

<footer class="footer">
	<p>© 2026 AI Dermatologist | Healthcare AI Project</p>
	<a href="{{ url_for('home') }}">Back to Home</a>
</footer>

</body>
</html>
