

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Feedback - AI Skin Disease Detection</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
	<style>
		.feedback-box { max-width:700px; margin:40px auto; background:white; padding:30px; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,0.08)}
		.feedback-box textarea { width:100%; min-height:140px; padding:12px; border-radius:6px; border:1px solid #ddd; }
		.feedback-box button { margin-top:12px; padding:12px 20px; background:#ff3f34; color:white; border:none; border-radius:6px; cursor:pointer }
	</style>
</head>
<body>
<header class="navbar">
	<div class="logo">SkinCare AI</div>
	<nav>
		<a href="{{ url_for('home') }}">Home</a>
		<a href="{{ url_for('login') }}">Login</a>
		<a href="{{ url_for('faq') }}">FAQ</a>
		<a href="{{ url_for('help_page') }}">Help</a>
		<a href="{{ url_for('disease_dictionary') }}">Disease Dictionary</a>
		<a href="{{ url_for('feedback') }}">Feedback</a>
	</nav>
</header>

<div style="padding:40px; background:#f9fbfd; min-height:70vh;">
	<div class="feedback-box">
		<h2>Send Us Feedback</h2>
		<p>Your feedback helps improve the system. Please be concise and respectful.</p>
		<form method="POST" action="{{ url_for('feedback') }}">
			<textarea name="comment" placeholder="Type your feedback here..." required></textarea>
			<br>
			<button type="submit">Submit Feedback</button>
		</form>
	</div>
</div>

<footer class="footer">
	<p>© 2026 AI Dermatologist | Healthcare AI Project</p>
	<a href="{{ url_for('home') }}">Back to Home</a>
</footer>
</body>
</html>
